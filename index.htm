<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OS Express PRO</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--surface);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        main {
            padding: 16px;
            flex: 1;
            padding-bottom: 120px; 
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed var(--border);
        }

        .total-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .footer-action {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>OS Express ⚡</header>

        <main>
            <div class="card">
                <div class="card-title">Dados do Cliente</div>
                <div class="form-group">
                    <label>Nome do Cliente *</label>
                    <input type="text" id="clientName" placeholder="Nome do cliente" value="Cliente Teste">
                </div>
                <div class="form-group">
                    <label>WhatsApp (com DDD)</label>
                    <input type="text" id="clientPhone" placeholder="Ex: 11999999999">
                </div>
            </div>

            <div class="card">
                <div class="card-title">Serviço & Valores</div>
                <div class="form-group">
                    <label>Descrição do Trabalho *</label>
                    <textarea id="serviceDescription" rows="3" placeholder="Descrição do serviço..."></textarea>
                </div>

                <div class="row">
                    <div class="form-group" style="flex: 1;">
                        <label>Mão de Obra (R\$)</label>
                        <input type="text" id="serviceValue" value="0" oninput="atualizarTotalTela()">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Materiais (R\$)</label>
                        <input type="text" id="materialsValue" value="0" oninput="atualizarTotalTela()">
                    </div>
                </div>

                <div class="total-box">
                    <span>Valor Total:</span>
                    <span class="total-price" id="totalDisplay">R$ 0,00</span>
                </div>
            </div>
        </main>

        <div class="footer-action">
            <button class="btn" onclick="processarOrcamento()">Gerar & Enviar Orçamento</button>
        </div>
    </div>

    <div class="modal" id="successModal">
        <div class="modal-content">
            <div style="font-size: 3rem; color: #16a34a; margin-bottom: 10px;">✓</div>
            <h3>Orçamento Gerado!</h3>
            <p id="osInfo" style="margin-bottom: 20px; margin-top: 10px; color: var(--text-light);"></p>
            <button class="btn" style="background-color: #16a34a;" onclick="enviarWhatsApp()">Enviar para o WhatsApp</button>
            <button class="btn" style="background: none; color: var(--text-light); margin-top: 8px;" onclick="fecharModal()">Criar Novo</button>
        </div>
    </div>

    <script>
        let dadosOrcamento = {};

        function obterSomaValores() {
            let txtObra = document.getElementById('serviceValue').value.replace(',', '.');
            let txtMat = document.getElementById('materialsValue').value.replace(',', '.');
            
            let obra = parseFloat(txtObra) || 0;
            let mat = parseFloat(txtMat) || 0;
            return obra + mat;
        }

        function atualizarTotalTela() {
            let total = obterSomaValores();
            document.getElementById('totalDisplay').innerText = "R\$ " + total.toFixed(2).replace('.', ',');
        }

        function processarOrcamento() {
            const nome = document.getElementById('clientName').value.trim() || "Cliente Geral";
            const foneRaw = document.getElementById('clientPhone').value.trim();
            const desc = document.getElementById('serviceDescription').value.trim() || "Serviço solicitado";
            
            let total = obterSomaValores();

            let foneLimpo = foneRaw.replace(/\D/g, '');
            if (foneLimpo.length > 0 && !foneLimpo.startsWith('55')) {
                foneLimpo = '55' + foneLimpo;
            }

            const numeroOS = Math.floor(1000 + Math.random() * 9000);
            const totalFormatado = "R\$ " + total.toFixed(2).replace('.', ',');

            dadosOrcamento = {
                fone: foneLimpo,
                mensagem: `Olá ${nome}!\nSegue o seu orçamento:\n\n*Ordem de Serviço:* Nº ${numeroOS}\n*Descrição:* ${desc}\n*Total:* ${totalFormatado}`
            };

            document.getElementById('osInfo').innerHTML = `<b>Cliente:</b> ${nome}<br><b>Total Calculado:</b> ${totalFormatado}`;
            document.getElementById('successModal').style.display = 'flex';
        }

        function enviarWhatsApp() {
            if (dadosOrcamento.mensagem) {
                window.open(`https://whatsapp.com{dadosOrcamento.fone}&text=${encodeURIComponent(dadosOrcamento.mensagem)}`, '_blank');
            }
        }

        function fecharModal() {
            document.getElementById('successModal').style.display = 'none';
            document.getElementById('serviceValue').value = '0';
            document.getElementById('materialsValue').value = '0';
            document.getElementById('serviceDescription').value = '';
            atualizarTotalTela();
        }
    </script>
</body>
</html>
